# ─────────────────────────────────────────────────────────────────────────────
# Astra CI/CD Pipeline
#
# Jobs:
#   1. contract  — Rust build + Soroban unit tests (wasm32v1-none)
#   2. backend   — TypeScript compile
#   3. frontend  — TypeScript check + ESLint + Next.js production build
#   4. deploy    — Render (backend) + Vercel (frontend) on main/master push
#
# Required GitHub Secrets:
#   RENDER_API_KEY            — Render → Account Settings → API Keys
#   RENDER_BACKEND_SERVICE_ID — Service ID for astra-repo-backend (srv-...)
#   VERCEL_TOKEN              — Vercel → Account Settings → Tokens
#   VERCEL_ORG_ID             — vercel.com/account → Settings → Team ID
#                               (or Personal Account ID for personal projects)
#   VERCEL_PROJECT_ID         — Vercel project → Settings → General → Project ID
# ─────────────────────────────────────────────────────────────────────────────

name: CI / CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── 1. Soroban Contract ─────────────────────────────────────────────────────
jobs:
  contract:
    name: "Contract — Rust / Soroban"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/astra_repo/target
          key: cargo-${{ hashFiles('contracts/astra_repo/Cargo.lock') }}
          restore-keys: cargo-

      - name: Build (release Wasm)
        working-directory: contracts/astra_repo
        run: cargo build --target wasm32v1-none --release

      - name: Run unit tests
        working-directory: contracts/astra_repo
        run: cargo test

      - name: Upload Wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra_repo_wasm
          path: contracts/astra_repo/target/wasm32v1-none/release/astra_repo.wasm
          retention-days: 7

  # ─── 2. Backend ──────────────────────────────────────────────────────────
  backend:
    name: "Backend — Node / TypeScript"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile
        run: npm run build

      - name: Upload compiled dist
        uses: actions/upload-artifact@v4
        with:
          name: backend_dist
          path: backend/dist/
          retention-days: 7

  # ─── 3. Frontend ─────────────────────────────────────────────────────────
  frontend:
    name: "Frontend — Next.js"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint -- --max-warnings 0
        continue-on-error: true   # lint warnings shouldn't block deploys

      - name: Next.js production build
        run: npm run build
        env:
          # Stub value so the build doesn't fail on missing env vars.
          # Real value is set in Vercel project environment variables.
          NEXT_PUBLIC_BACKEND_URL: "https://astra-9mg6.onrender.com"

      - name: Upload Next.js build
        uses: actions/upload-artifact@v4
        with:
          name: frontend_build
          path: frontend/.next/
          retention-days: 7

  # ─── 4. Deploy (main/master push only) ───────────────────────────────────
  deploy:
    name: "Deploy → Render + Vercel"
    needs: [contract, backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      # ── 4a. Backend → Render ─────────────────────────────────────────────
      - name: Deploy backend → Render
        run: |
          echo "Triggering Render backend deploy..."
          HTTP=$(curl -s -o /tmp/render_resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys" \
            -d '{"clearCache": "do_not_clear"}')
          echo "Render response: HTTP $HTTP"
          cat /tmp/render_resp.json
          [ "$HTTP" = "201" ] || [ "$HTTP" = "200" ] || { echo "Render deploy failed (HTTP $HTTP)"; exit 1; }

      # ── 4b. Frontend → Vercel ─────────────────────────────────────────────
      - name: Checkout (needed for Vercel CLI)
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment & project info
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build for Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel (production)
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "Deployed to: $URL"
          echo "VERCEL_URL=$URL" >> $GITHUB_ENV

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "## Deployment complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | Render   | Deploy queued |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | Vercel  | ${{ env.VERCEL_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Contract Wasm | — | Artifact saved (7 days) |" >> $GITHUB_STEP_SUMMARY
