[package]
name = "astra_repo"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = { version = "27.0.5" }

[dev-dependencies]
soroban-sdk = { version = "27.0.5", features = ["testutils"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
